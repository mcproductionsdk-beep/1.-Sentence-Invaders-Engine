name: Sentence Invaders preview
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  static-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-preview.mjs
      - run: node --check dist-preview/engine/invaders.js
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-preview.mjs

      - run: node scripts/test-deployed-preview.mjs
        env:
          INVADERS_REVIEW_URL: https://16dfade3.bt-sentence-invaders-preview.pages.dev/
