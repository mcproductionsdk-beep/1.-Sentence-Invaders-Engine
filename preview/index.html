<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sentence Invaders | Staging preview</title><link rel="stylesheet" href="engine/invaders.css"><script src="engine/invaders.js" defer></script></head><body><section id="preview"><h1>Sentence Invaders staging preview</h1><p>Fixed Spanish sample for gameplay review. Shoot the next word to build the sentence. Move with arrows or A/D; Space fires. On touch screens, slide to steer and tap to fire.</p><button id="play">Play sample</button></section><main id="gameArea" hidden><header><h1>SENTENCE INVADERS</h1><p id="stats"></p></header><nav class="gamebar" aria-label="Game controls"><button id="pause">PAUSE</button><button id="restart">RESTART</button><button id="backMenu">MAIN MENU</button><button id="sound" aria-pressed="true">SOUND ON</button></nav><div id="prompt"><strong id="english"></strong></div><section id="hud" aria-label="Build the sentence"><div id="tiles" class="tiles"></div></section><div id="game"><canvas id="canvas" width="960" height="600"></canvas><div id="notice">NOPE</div><div id="flash"><b id="complete"></b><small id="completeInfo"></small><button id="continue">NEXT SENTENCE</button></div></div><div id="touchControls"><button id="left" aria-label="Move left">◀</button><button id="fire">FIRE</button><button id="right" aria-label="Move right">▶</button></div><div id="thumbDeck"><span>◀</span><span>Slide to steer<br>Tap to fire</span><span>▶</span></div></main></body></html>
